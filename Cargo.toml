[package]
name = "gray-gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Merged tool-call policy plugin for the gray agent harness: permissions, confirm, tool-gate, guard, repguard"

[[bin]]
name = "gate"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
fancy-regex = "0.14"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
